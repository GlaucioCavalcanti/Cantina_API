services:
  - type: web
    name: cantina-interativa-api
    env: docker
    branch: main
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://seusite.com
      - key: PORT
        value: 8000
